server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /estudiantes {
        proxy_pass http://estudiantes:5002;
    }

    location /cursos {
        proxy_pass http://cursos_service:5000;
    }

    location /matriculas {
        proxy_pass http://matriculas_service:5003;
    }
}