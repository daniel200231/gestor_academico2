services:
  db_estudiantes:
    image: postgres:16
    environment:
      - POSTGRES_DB=${ESTUDIANTES_DB_NAME}
      - POSTGRES_USER=${ESTUDIANTES_DB_USER}
      - POSTGRES_PASSWORD=${ESTUDIANTES_DB_PASSWORD}
    volumes:
      - estudiantes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ESTUDIANTES_DB_USER} -d ${ESTUDIANTES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  estudiantes:
    build: ./estudiantes_service
    ports:
      - "5001:5002"
    env_file: .env
    restart: on-failure
    depends_on:
      db_estudiantes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db_cursos:
    image: postgres:16
    environment:
      - POSTGRES_DB=${CURSOS_DB_NAME}
      - POSTGRES_USER=${CURSOS_DB_USER}
      - POSTGRES_PASSWORD=${CURSOS_DB_PASSWORD}
    volumes:
      - cursos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CURSOS_DB_USER} -d ${CURSOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cursos_service:
    build: ./cursos_service
    ports:
      - "5002:5000"
    environment:
      - DB_HOST=db_cursos
      - DB_PORT=${CURSOS_DB_PORT}
      - DB_NAME=${CURSOS_DB_NAME}
      - DB_USER=${CURSOS_DB_USER}
      - DB_PASSWORD=${CURSOS_DB_PASSWORD}
      - DELAY=${CURSOS_DELAY}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
    restart: always
    depends_on:
      db_cursos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db_matriculas:
    image: postgres:16
    environment:
      - POSTGRES_DB=${MATRICULAS_DB_NAME}
      - POSTGRES_USER=${MATRICULAS_DB_USER}
      - POSTGRES_PASSWORD=${MATRICULAS_DB_PASSWORD}
    volumes:
      - matriculas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATRICULAS_DB_USER} -d ${MATRICULAS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  matriculas_service:
    build: ./matriculas_service
    ports:
      - "5003:5003"
    environment:
      - DB_HOST=db_matriculas
      - DB_PORT=${MATRICULAS_DB_PORT}
      - DB_NAME=${MATRICULAS_DB_NAME}
      - DB_USER=${MATRICULAS_DB_USER}
      - DB_PASSWORD=${MATRICULAS_DB_PASSWORD}
      - ESTUDIANTES_URL=${ESTUDIANTES_URL}
      - CURSOS_URL=${CURSOS_URL}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - CB_FAIL_MAX=${CB_FAIL_MAX}
      - CB_RESET_TIMEOUT=${CB_RESET_TIMEOUT}
    restart: always
    depends_on:
      db_matriculas:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  home:
    build: ./home
    ports:
      - "8080:80"
    restart: always
    depends_on:
      estudiantes:
        condition: service_healthy
      cursos_service:
        condition: service_healthy
      matriculas_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:80/health || wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  estudiantes_data:
  cursos_data:
  matriculas_data: